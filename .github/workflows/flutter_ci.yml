name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tests:
    name: Analyze + Unit/Widget/Golden Tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests (includes golden checks)
        run: flutter test

      - name: Upload golden failure diffs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            failures/**
            **/failures/**
          if-no-files-found: ignore

  integration-emulator:
    name: Integration (Firestore/Auth Emulator + Android Emulator)
    runs-on: ubuntu-latest
    # Run manually or enable on pushes if desired
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@latest
          firebase --version

      - name: Android Emulator Tests with Firebase Emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          script: |
            # Start emulators and run integration tests against them
            firebase emulators:exec --only firestore,auth "flutter test -d emulator-5554 \
              --dart-define=FIRESTORE_EMULATOR_HOST=10.0.2.2 \
              --dart-define=FIRESTORE_EMULATOR_PORT=8080 \
              integration_test/clinic_header_live_update_test.dart integration_test/security_rules_test.dart"

