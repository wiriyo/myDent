  <script>
    (function () {
      'use strict';

      const LOG_PREFIX = '[MyDent|QZ]';
      const cacheBust = String(Date.now());
      const withCacheBust = (url) => `${url}${url.includes('?') ? '&' : '?'}v=${encodeURIComponent(cacheBust)}`;

      const sources = {
        qz: [
          { url: 'https://cdn.jsdelivr.net/npm/qz-tray@2.2.5/qz-tray.js', type: 'remote' },
          { url: 'third_party/qz-tray.js', type: 'local' },
        ],
        jsrsasign: [
          { url: 'https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/11.1.0/jsrsasign-all-min.js', type: 'remote' },
          { url: 'third_party/jsrsasign-all-min.js', type: 'local' },
        ],
      };

      const loadRemote = (label, url) => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = withCacheBust(url);
        script.async = false;
        script.crossOrigin = 'anonymous';
        script.onload = () => resolve();
        script.onerror = (error) => reject(error || new Error(`Failed to load ${label} from ${url}`));
        document.head.appendChild(script);
      });

      const loadLocal = async (label, url) => {
        const response = await fetch(withCacheBust(url), { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Local fallback for ${label} not found (${response.status})`);
        }
        const code = await response.text();
        const script = document.createElement('script');
        script.async = false;
        script.type = 'text/javascript';
        script.text = code;
        document.head.appendChild(script);
      };

      const loadSequential = async (label, list) => {
        let lastError = null;
        for (const source of list) {
          try {
            if (source.type === 'local') {
              await loadLocal(label, source.url);
              console.info(`${LOG_PREFIX} Loaded ${label} from local fallback: ${source.url}`);
            } else {
              await loadRemote(label, source.url);
              console.info(`${LOG_PREFIX} Loaded ${label} from CDN: ${source.url}`);
            }
            return;
          } catch (error) {
            lastError = error;
            console.warn(`${LOG_PREFIX} Failed to load ${label} from ${source.url}`, error);
          }
        }
        throw lastError || new Error(`Unable to load ${label}`);
      };

      window.__mydentLoadQzPromise = (async () => {
        await loadSequential('qz-tray.js', sources.qz);
        await loadSequential('jsrsasign', sources.jsrsasign);
      })();

      window.__mydentLoadQzPromise.catch((error) => {
        console.error(`${LOG_PREFIX} Failed to load QZ dependencies`, error);
      });
    })();
  </script>

      const encodePc874 = (input) => {
        const source = Array.from(String(input ?? ''));
        const bytes = [];
        for (const char of source) {
          const codePoint = char.codePointAt(0);
          if (codePoint === 0x0a || codePoint === 0x0d) {
            bytes.push(codePoint);
          } else if (codePoint === 0x00a0) {
            bytes.push(0xa0);
          } else if (codePoint >= 0x00 && codePoint <= 0x7f) {
            bytes.push(codePoint);
          } else if (_unicodeToPc874.has(codePoint)) {
            bytes.push(_unicodeToPc874.get(codePoint));
          } else {
            bytes.push(UNKNOWN_GLYPH_BYTE);
          }
        }
        return Uint8Array.from(bytes);
      };

      const bytesToHex = (bytes) => {
        let hex = '';
        for (let i = 0; i < bytes.length; i += 1) {
          hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
        }
        return hex;

      const buildThaiTextPayload = (text, includeCut = true) => {
        const baseText = String(text ?? '');
        const normalized = baseText.endsWith('\n') ? baseText : `${baseText}\n`;
        const cfg = window.mydentQzConfig || {};
        const ordered = [70];
        const codepages = Array.isArray(cfg.thaiCodepages) ? cfg.thaiCodepages : [];
        for (const cp of codepages) {
          if (typeof cp === 'number') ordered.push(cp & 0xff);
        }
        const direct = cfg.thaiCodepage ?? cfg.thaiCodePage;
        if (typeof direct === 'number') ordered.push(direct & 0xff);
        ordered.push(255);
        const thaiCodePages = Array.from(new Set(ordered));

        const bytes = [];
        bytes.push(0x1b, 0x25, 0x00);
        bytes.push(0x1c, 0x2e);

        bytes.push(0x1b, 0x52, intlSet & 0xff);
        for (const cp of thaiCodePages) {
          bytes.push(0x1b, 0x74, cp & 0xff);
        }
        const textBytes = encodePc874(normalized);
        bytes.push(...textBytes);
        if (includeCut) {
          bytes.push(0x0a);
          bytes.push(0x1d, 0x56, 0x00);
        }

        let command = '';
        for (const byte of bytes) {

          internationalSet: intlSet & 0xff,
          encoding: 'TIS-620',

      const parseCertificateMeta = (pem) => {
        try {
          const raw = String(pem || '').trim();
          if (!raw) {
            return null;
          }
          if (typeof KJUR === 'undefined' || !KJUR.asn1 || !KJUR.asn1.x509) {

          }
          const cert = new KJUR.asn1.x509.X509();
          cert.readCertPEM(raw);
          const subject = cert.getSubjectString?.() || cert.getSubjectString;
          const issuer = cert.getIssuerString?.() || cert.getIssuerString;
          const notAfter = cert.getNotAfter?.() || cert.getNotAfter;
          const notBefore = cert.getNotBefore?.() || cert.getNotBefore;
          const parseDate = (value) => {
            if (!value) {
              return null;
            }
            try {
              if (typeof value === 'string' && value.endsWith('Z') && value.length >= 13 && KJUR?.jws?.IntDate?.getDate) {
                return KJUR.jws.IntDate.getDate(value);
              }
              return new Date(value);
            } catch (dateErr) {
              console.warn(`${LOG_PREFIX} ไม่สามารถแปลงวันที่ของ certificate`, dateErr);
              return null;
            }
          };
          const expiry = parseDate(typeof notAfter === 'function' ? notAfter.call(cert) : notAfter);
          const effective = parseDate(typeof notBefore === 'function' ? notBefore.call(cert) : notBefore);
          const now = new Date();
          const isValid = Boolean(
            expiry && effective && now.getTime() >= effective.getTime() && now.getTime() <= expiry.getTime(),
          );
          return {
            subject: typeof subject === 'function' ? subject.call(cert) : subject,
            issuer: typeof issuer === 'function' ? issuer.call(cert) : issuer,
            expiry,
            effective,
            isValid,
            pem: raw,

          console.warn(`${LOG_PREFIX} วิเคราะห์ certificate ไม่สำเร็จ`, err);

        const normalized = String(path || '').trim();
        if (!normalized) {

        const response = await fetch(normalized, { cache: 'no-store' });

      const extractPemBlock = (input) => {
        const raw = String(input || '');
        const match = raw.match(/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/);
        return (match ? match[0] : raw).trim();
      };

      const loadDevCredentials = async () => {
        if (cachedDevCertificatePem && cachedDevPrivateKeyPem) {
          return {
            certificate: cachedDevCertificatePem,
            privateKey: cachedDevPrivateKeyPem,
            mode: 'dev',
          };
        }
        const [certificatePem, privateKeyPem] = await Promise.all([

          fetchTextAsset(DEV_PRIVATE_KEY_PATH),
        ]);
        cachedDevCertificatePem = extractPemBlock(certificatePem);
        cachedDevPrivateKeyPem = privateKeyPem.trim();
        recordCertificateMeta(cachedDevCertificatePem);
        log('info', 'โหลด demo certificate/key สำหรับโหมดพัฒนาเรียบร้อย');
        return {
          certificate: cachedDevCertificatePem,

      const callSignatureEndpoint = async (endpoint, payload) => {
        const target = String(endpoint || '').trim();
        if (!target) {
          throw new Error('ไม่พบ signature endpoint สำหรับ production');
        }
        const response = await fetch(target, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ payload }),
        });
        if (!response.ok) {
          throw new Error(`signature endpoint ตอบกลับ ${response.status}`);
        }
        const data = await response.json();
        if (!data || typeof data.signature !== 'string') {
          throw new Error('signature endpoint ตอบกลับไม่ถูกต้อง');
        }
        return data.signature;
      };

      const loadProductionCredentials = async () => {
        const config = window.mydentQzConfig || {};
        const certificatePem = extractPemBlock(config.productionCertificatePem || config.certificatePem || '');
        if (!certificatePem) {
          throw new Error('Production certificate ไม่ได้ถูกกำหนด');
        }
        recordCertificateMeta(certificatePem);
        let signer = null;
        if (typeof config.productionSigner === 'function') {
          signer = config.productionSigner;
        } else if (typeof config.signMessage === 'function') {
          signer = config.signMessage;
        } else if (config.signatureEndpoint) {
          signer = (toSign) => callSignatureEndpoint(config.signatureEndpoint, toSign);
        }
        if (!signer) {
          throw new Error('Production signature provider ไม่พร้อมใช้งาน (ต้องกำหนด productionSigner/signMessage/signatureEndpoint)');
        }
        return {
          certificate: certificatePem,
          signer,
          mode: 'prod',

      const loadSecurityMaterial = async () => {
        updateSecurityState({ environment: CURRENT_ENVIRONMENT });
        try {
          const pending = window.__mydentLoadQzPromise;
          if (pending && typeof pending.then === 'function') {
            await pending;
          }
        } catch (promiseError) {
          log('warn', 'โหลดสคริปต์ QZ Tray ไม่ครบถ้วนก่อนตั้งค่า security', promiseError);

      const whitelistPayload = () => `${REQUIRED_WHITELIST.join('\n')}\n`;

      const ensureWhitelistViaApi = async () => {
        if (!window.qz || !qz.security) {

        }

          try {
            await qz.security.setAllowedOrigins(REQUIRED_WHITELIST);

            updateSecurityState({ whitelistEnsured: true, whitelistError: null, whitelistUpdatedAt: Date.now() });
            return true;
          } catch (err) {
            log('warn', 'ตั้งค่า whitelist ผ่าน API ไม่สำเร็จ', err);
          }

          const config = qz.configs.create(whitelistFileUri, { copies: 1, colorType: 'grayscale', encoding: 'utf8' });

            {
              type: 'raw',
              format: 'plain',
              data: payload,
            },
          ];
          await qz.print(config, data);
          updateSecurityState({ whitelistEnsured: true, whitelistError: null, whitelistUpdatedAt: Date.now() });
          log('info', 'เขียน whitelist.txt ผ่าน QZ Tray แล้ว (กรุณารีสตาร์ท QZ Tray หากยังไม่รับค่าใหม่)');
          return true;
        } catch (err) {
          updateSecurityState({ whitelistError: err?.message || 'ไม่สามารถอัปเดต whitelist ได้' });
          log('warn', 'เขียน whitelist.txt อัตโนมัติไม่สำเร็จ', err);
          return false;
        }
      };

      const attemptWhitelistRepair = async (reason) => {
        if (whitelistPendingWrite) {
          return;
        }
        whitelistPendingWrite = true;
        try {
          log('warn', `พยายามซ่อม whitelist อัตโนมัติ (${reason || 'unknown'})`);
          const appliedViaApi = await ensureWhitelistViaApi();
          if (appliedViaApi) {
            return;
          }
          await writeWhitelistFile();
        } finally {
          whitelistPendingWrite = false;
        }
      };

      const shouldAttemptWhitelistRepair = (error) => {
        if (!error) {
          return false;
        }
        const message = String(error.message || error).toLowerCase();
        if (message.includes('whitelist') || message.includes('untrusted') || message.includes('trust')) {
          return true;
        }
        if (typeof error.code === 'string') {
          const normalized = error.code.toLowerCase();
          if (normalized.includes('whitelist') || normalized.includes('trust')) {
            return true;
          }
        }
        return false;
      };

      const logSecuritySummary = () => {
        const certificateStatus = lastSecurityState.certificateValid === true
          ? 'Valid'
          : lastSecurityState.certificateValid === false
            ? 'Invalid'
            : 'Unknown';
        const trustedStatus = lastSecurityState.trusted === false
          ? 'Untrusted'
          : lastSecurityState.trusted === true
            ? 'OK'
            : 'Unknown';
        const connectionStatus = connectionState === 'active' ? 'Ready' : connectionState;
        console.log(`${LOG_PREFIX} Certificate: ${certificateStatus}`);
        console.log(`${LOG_PREFIX} Trusted: ${trustedStatus}`);
        console.log(`${LOG_PREFIX} Connection: ${connectionStatus}`);
      };

      const verifyRemoteCertificateChain = async () => {
        if (!window.qz || !qz.api) {
          return false;
        }
        try {
          if (typeof qz.api.getCertificate === 'function') {
            const chain = await qz.api.getCertificate();
            if (Array.isArray(chain) && chain.length > 0) {
              const leaf = chain[0];
              if (leaf) {
                const pem = typeof leaf === 'string' ? leaf : leaf.pem || leaf.certificate;
                if (pem) {
                  recordCertificateMeta(pem);
                }
              }
              if (chain.length > 1) {
                const root = chain[chain.length - 1];
                const rootPem = typeof root === 'string' ? root : root.pem || root.certificate;
                if (rootPem) {
                  parseCertificateMeta(rootPem);
                }

              return true;
            }

          log('warn', 'ไม่สามารถตรวจสอบ certificate chain จาก QZ Tray ได้', err);
        }
        return false;
      };

      const createError = (code, message, original) => {
        const err = new Error(message || code);
        err.code = code;
        if (original) {
          err.original = original;
          if (original.message && !err.message) {
            err.message = original.message;
          }
        }
        return err;
      };

      const hexToBase64 = (hex) => {
        if (typeof hextob64 === 'function') {
          return hextob64(hex);
        }
        if (KJUR?.crypto?.Util?.hex2b64) {
          return KJUR.crypto.Util.hex2b64(hex);
        }
        const bytes = hex.match(/.{1,2}/g)?.map((pair) => String.fromCharCode(parseInt(pair, 16))).join('') || '';
        return btoa(bytes);
      };

      const isDevHost = () => {
        const host = window.location.hostname;
        return host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
      };

      const isSecureOrigin = () => window.location.protocol === 'https:';


      const warnIfInsecureOrigin = () => {
        const protocol = window.location.protocol;
        if (protocol !== 'https:' && !isDevHost()) {
          console.warn(
            `${LOG_PREFIX} คำเตือน: QZ Tray รองรับเต็มที่บน origin แบบ HTTPS เท่านั้น (ยกเว้น http://localhost สำหรับงานพัฒนา) — origin ปัจจุบันคือ ${window.location.origin}`,
          );
        }
      };

      const updateState = (state) => {
        connectionState = state;
        if (state !== 'active') {
          connectionReadyLogged = false;
        }
        dispatchStatusEvent();
      };

      const getStatus = () => {
        if (window.qz && qz.websocket && typeof qz.websocket.isActive === 'function' && qz.websocket.isActive()) {
          return 'active';
        }
        return connectionState;
      };

      const ensureQzAvailable = () => {
        if (!window.qz || !qz.websocket) {
          log('error', 'QZ Tray library "window.qz" is missing. Confirm qz-tray.js is loaded before flutter_bootstrap.js.');
          throw createError('qz_bridge_missing', 'ไม่พบไลบรารี QZ Tray (ลองกด \"ลองโหลดบริดจ์ใหม่\" หรือรีเฟรชหน้า)');
        }
      };

      const logConnectionReady = () => {
        if (!connectionReadyLogged) {
          connectionReadyLogged = true;
          log('info', 'Connection: Ready');
        }
      };

      const attachWebsocketHandlers = () => {
        if (handlersAttached || !window.qz || !qz.websocket) {
          return;
        }
        const websocket = qz.websocket;
        const openedHandler = () => updateState('active');
        const closedHandler = () => updateState('inactive');
        const errorHandler = (event) => {
          log('warn', 'QZ Tray websocket error callback', event);
          updateState('inactive');
        };

        if (typeof websocket.setOpenedHandlers === 'function') {
          websocket.setOpenedHandlers([openedHandler]);
        } else if (typeof websocket.setOpenedCallbacks === 'function') {
          websocket.setOpenedCallbacks([openedHandler]);
        }

        if (typeof websocket.setClosedHandlers === 'function') {
          websocket.setClosedHandlers([closedHandler]);
        } else if (typeof websocket.setClosedCallbacks === 'function') {
          websocket.setClosedCallbacks([closedHandler]);
        }

        if (typeof websocket.setErrorHandlers === 'function') {
          websocket.setErrorHandlers([errorHandler]);
        } else if (typeof websocket.setErrorCallbacks === 'function') {
          websocket.setErrorCallbacks([errorHandler]);
        }

        handlersAttached = true;
      };

      const snapshotDependencyStatus = () => ({
        qzObject: typeof window.qz !== 'undefined',
        websocket: typeof window.qz?.websocket !== 'undefined',
        jsrsasign: {
          KJUR: typeof window.KJUR !== 'undefined',
          KEYUTIL: typeof window.KEYUTIL !== 'undefined',
        },
        loadPromise: typeof window.__mydentLoadQzPromise !== 'undefined',
      });

      const logDependencySnapshot = () => {
        if (!dependencySnapshotLogged) {
          dependencySnapshotLogged = true;
          const snapshot = snapshotDependencyStatus();
          console.log(`${LOG_PREFIX} Dependency snapshot`, snapshot);
          const scripts = listDependencyScripts();
          console.log(`${LOG_PREFIX} Dependency scripts`, scripts);
        }

        if (!dependencyCheckLogged) {
          dependencyCheckLogged = true;
          checkDependencyStatus()
            .then((report) => {
              console.log(`${LOG_PREFIX} Dependency check`, report);
            })
            .catch((error) => {
              console.warn(`${LOG_PREFIX} Dependency check failed`, error);
              dependencyCheckLogged = false;
            });
        }
      };

      const checkDependencyStatus = async () => {
        const snapshot = snapshotDependencyStatus();

        if (snapshot.qzObject && typeof qz?.api?.getVersion === 'function') {
          try {
            snapshot.version = await qz.api.getVersion();
          } catch (error) {
            snapshot.versionError = toSerializableError(mapConnectionError(error));
          }
        }

        return snapshot;
      };

      const listDependencyScripts = () => Array
        .from(document.querySelectorAll('script[src]'))
        .map((node) => node.getAttribute('src'))
        .filter((src) => !!src && (src.includes('qz') || src.includes('jsrsasign')));

      const ensureLoaded = () => {
        if (window.qz && qz.websocket) {
          ensureQzAvailable();
          attachWebsocketHandlers();
          if (!bridgeReadyLogged) {
            bridgeReadyLogged = true;
            log('info', 'Bridge: Ready');
          }
          logDependencySnapshot();
          return Promise.resolve();
        }

        if (ensureLoadedPromise) {
          return ensureLoadedPromise;
        }

        ensureLoadedPromise = new Promise((resolve, reject) => {
          const start = Date.now();

          const check = () => {
            if (window.qz && qz.websocket) {
              ensureLoadedPromise = null;
              ensureQzAvailable();
              attachWebsocketHandlers();
              if (!bridgeReadyLogged) {
                bridgeReadyLogged = true;
                log('info', 'Bridge: Ready');
              }
              logDependencySnapshot();
              resolve();
              return;
            }

            if (Date.now() - start >= QZ_LOAD_TIMEOUT_MS) {
              ensureLoadedPromise = null;
              const err = createError(
                'qz_bridge_missing',
                'ไม่พบสคริปต์ qz-tray.js (ลองกด "ลองโหลดบริดจ์ใหม่" หรือรีเฟรชหน้า)'
              );
              log('error', 'Failed to detect qz-tray.js. Fix web/index.html and perform a full restart.', err);
              reject(err);
              return;
            }

            setTimeout(check, QZ_LOAD_POLL_INTERVAL_MS);
          };

          check();
        });

        return ensureLoadedPromise;
      };

      const configureSecurityIfNeeded = async () => {
        if (securityConfigured) {
          return;
        }

        ensureQzAvailable();

        if (!window.qz.security) {
          throw createError('qz_security_error', 'ไม่สามารถตั้งค่า security สำหรับ QZ Tray');
        }

        if (typeof KJUR === 'undefined' || typeof KEYUTIL === 'undefined') {
          throw createError('qz_security_error', 'ไม่พบ jsrsasign สำหรับลงนามข้อความ demo');
        }

        const material = await loadSecurityMaterial();
        activeSecurityMaterial = material;
        qz.security.setSignatureAlgorithm('SHA512');
        qz.security.setCertificatePromise((resolve, reject) => {
          try {
            if (material.mode === 'dev') {
              log('warn', 'กำลังใช้ demo certificate ของ QZ Tray (dev mode เท่านั้น)');
              console.warn(`${LOG_PREFIX} ใช้ DEMO certificate/signature (dev mode) – ห้ามใช้ใน production`);
            }
            resolve(material.certificate);
          } catch (err) {
            reject(createError('qz_security_error', 'ไม่สามารถโหลด certificate สำหรับ QZ Tray', err));
          }
        });

        qz.security.setSignaturePromise((toSign) => async (resolve, reject) => {
          try {
            if (material.mode === 'dev') {
              if (!demoSignatureWarned) {
                demoSignatureWarned = true;
                log('warn', 'กำลังใช้ demo signature ของ QZ Tray (dev mode เท่านั้น)');
                console.warn(`${LOG_PREFIX} ใช้ DEMO signature (dev mode) – ห้ามใช้ใน production`);
              }
              const pk = KEYUTIL.getKey(material.privateKey);
              const signature = new KJUR.crypto.Signature({ alg: 'SHA512withRSA' });
              signature.init(pk);
              signature.updateString(toSign);
              const hex = signature.sign();
              const b64 = hexToBase64(hex);
              resolve(b64);
              return;
            }

            if (typeof signer !== 'function') {
              throw new Error('Production signer function ไม่พร้อมใช้งาน');
            }
            const result = await signer(toSign);
            if (!result || typeof result !== 'string') {
              throw new Error('Production signer ส่งข้อมูลไม่ถูกต้อง');
            }
            resolve(result);
          } catch (err) {
            reject(createError('qz_security_error', 'ลงนามข้อความไม่สำเร็จ', err));
          }
        });

        securityConfigured = true;
      };

      const buildEndpointUrl = (endpoint) => `wss://${endpoint.host}:${endpoint.port}`;

      const parseEndpoint = (candidate, fallbackPort = DEFAULT_QZ_PORT) => {
        if (!candidate) {
          return null;
        }

        const make = (host, secure, portValue) => createEndpoint(
          host,
          secure,
          Number.isNaN(Number.parseInt(portValue, 10)) ? fallbackPort : Number.parseInt(portValue, 10),
        );

        if (typeof candidate === 'string') {
          const value = candidate.trim();
          if (!value) {
            return null;
          }

          try {
            if (!value.includes('://')) {
              return make(value, true, fallbackPort);
            }

            const parsed = new URL(value);
            if (parsed.protocol !== 'wss:') {
              return null;
            }

            const secure = true;
            const port = parsed.port ? Number.parseInt(parsed.port, 10) : fallbackPort;
            return make(parsed.hostname, secure, port);
          } catch (err) {
            log('warn', `ไม่สามารถตีความ endpoint override: ${value}`, err);
            return null;
          }
        }

        if (typeof candidate === 'object') {
          const host = String(candidate.host || '').trim();
          if (!host) {
            return null;
          }
          const secure = true;
          const portValue = candidate.port === undefined ? fallbackPort : candidate.port;
          return make(host, secure, portValue);
        }

        return null;
      };

      const readConnectionOverrides = () => {
        const overrides = window.mydentQzConfig || {};
        const fallbackPort = Number.isNaN(Number.parseInt(overrides.port, 10))
          ? DEFAULT_QZ_PORT
          : Number.parseInt(overrides.port, 10);
        const parsedEndpoints = [];

        if (Array.isArray(overrides.endpoints)) {
          overrides.endpoints.forEach((endpoint) => {
            const parsed = parseEndpoint(endpoint, fallbackPort);
            if (parsed) {
              parsedEndpoints.push(parsed);
            }
          });
        }

        const hostOverride = typeof overrides.host === 'string' ? overrides.host.trim() : '';
        if (hostOverride) {
          const secureEndpoint = parseEndpoint({ host: hostOverride, port: fallbackPort, secure: true }, fallbackPort);
          if (secureEndpoint) {
            parsedEndpoints.push(secureEndpoint);
          }
        }

        const keepAlive = typeof overrides.keepAlive === 'number' ? overrides.keepAlive : undefined;
        const retries = typeof overrides.retries === 'number' ? overrides.retries : undefined;
        const delayMs = typeof overrides.delay === 'number' ? overrides.delay : undefined;

        return {
          endpoints: parsedEndpoints,
          keepAlive,
          retries,
          delay: delayMs,
        };
      };

      const buildEndpointList = (overrides) => {
        const seen = new Set();
        const combined = [...overrides.endpoints, ...DEFAULT_ENDPOINTS];
        return combined.reduce((acc, endpoint) => {
          if (!endpoint) {
            return acc;
          }
          const url = endpoint.url || buildEndpointUrl(endpoint);
          if (seen.has(url)) {
            return acc;
          }
          seen.add(url);
          acc.push({ ...endpoint, url });
          return acc;
        }, []);
      };

      const createConnectConfig = (endpoint, overrides) => {
        const usingSecure = true;
        const config = {
          host: [endpoint.host],
          hostIndex: 0,
          usingSecure,
          port: {
            secure: [endpoint.port],
            insecure: [],
            portIndex: 0,
          },
          retries: 0,
          delay: 0,
          trustAllCertificates: IS_DEV,
          allowSelfSigned: IS_DEV,
        };

        if (typeof overrides.keepAlive === 'number') {
          config.keepAlive = overrides.keepAlive;
        }
        if (typeof overrides.retries === 'number') {
          config.retries = overrides.retries;
        }
      if (typeof overrides.delay === 'number') {
        config.delay = overrides.delay;
      }

      return config;
      };

      const toSerializableError = (error) => (error ? { code: error.code, message: error.message } : null);

      const CONNECTION_ERROR_MESSAGES = {
        qz_not_running: 'กรุณาเปิด QZ Tray ก่อนใช้งาน หรือคลิก \"เปิด QZ Tray\" แล้วลองใหม่',
        qz_security_error: 'certificate หรือ signature ของ QZ Tray ไม่ผ่านการตรวจสอบ หรือ origin นี้ยังไม่ได้อยู่ใน Allowed Origins (หลังแก้ไขให้รีเฟรชหน้าแล้วลองใหม่)',
        qz_ws_refused: 'ไม่สามารถเชื่อมต่อพอร์ต 8181 ได้ อาจถูก Firewall หรือ Antivirus บล็อกไว้',
        qz_ws_timeout: 'หมดเวลารอการตอบสนองจาก QZ Tray กรุณาตรวจสอบว่าโปรแกรมเปิดอยู่และพอร์ต 8181 ถูกอนุญาต',
        qz_mixed_content: 'หน้าเว็บนี้ทำงานผ่าน HTTPS จำเป็นต้องใช้ wss:// เชื่อมต่อ QZ Tray เท่านั้น',
        qz_connect_failed: 'เชื่อมต่อ QZ Tray ไม่สำเร็จ',
      };

      const mapConnectionError = (error) => {
        const toError = (code, fallback) => createError(code, CONNECTION_ERROR_MESSAGES[code] || fallback, error);

        if (error && typeof error.code === 'string') {
          const normalized = error.code.toLowerCase();
          if (CONNECTION_ERROR_MESSAGES[normalized]) {
            return toError(normalized, error.message || CONNECTION_ERROR_MESSAGES[normalized]);
          }
          if (normalized.includes('signature')) {
            return toError('qz_security_error', CONNECTION_ERROR_MESSAGES.qz_security_error);
          }
        }

        const message = String(error?.message || error || '').toLowerCase();

        if (message.includes('mixed content') || message.includes('insecure websocket')) {
          return toError('qz_mixed_content', 'ไม่สามารถเชื่อมต่อผ่าน ws:// จากหน้า https://');
        }

        if (
          message.includes('security')
          || message.includes('certificate')
          || message.includes('signature')
          || message.includes('trust')
          || message.includes('whitelist')
        ) {
          return toError('qz_security_error', CONNECTION_ERROR_MESSAGES.qz_security_error);
        }

        if (
          message.includes('refused')
          || message.includes('blocked')
          || message.includes('denied')
          || message.includes('forbidden')
          || message.includes('ecconnrefused')
        ) {
          return toError('qz_ws_refused', CONNECTION_ERROR_MESSAGES.qz_ws_refused);
        }

        if (message.includes('timeout') || message.includes('timed out')) {
          return toError('qz_ws_timeout', CONNECTION_ERROR_MESSAGES.qz_ws_timeout);
        }

        if (
          message.includes('launch')
          || message.includes('not running')
          || message.includes('not started')
          || message.includes('unavailable')
        ) {
          return toError('qz_not_running', CONNECTION_ERROR_MESSAGES.qz_not_running);
        }

        return toError('qz_connect_failed', CONNECTION_ERROR_MESSAGES.qz_connect_failed);
      };

      const ensureLaunchIframe = () => {
        if (!launchIframe) {
          launchIframe = document.createElement('iframe');
          launchIframe.style.display = 'none';
          launchIframe.width = '0';
          launchIframe.height = '0';
          launchIframe.title = 'mydent-qz-launch';
          document.body.appendChild(launchIframe);
        }
        return launchIframe;
      };

      const tryLaunchQz = async () => {
        try {
          const frame = ensureLaunchIframe();
          frame.src = 'qz:launch';
          log('info', 'เรียก qz:launch ผ่าน iframe เพื่อเปิด QZ Tray');
        } catch (error) {
          log('warn', 'เรียก qz:launch ผ่าน iframe ไม่สำเร็จ', error);
        }
      };

      const connectOnce = async (config, timeoutMs) => {
        if (qz.websocket.isActive()) {
          return;
        }

        let timeoutHandle = null;

        try {
          const connectPromiseLocal = qz.websocket.connect(config);

          if (timeoutMs && timeoutMs > 0) {
            const timeoutPromise = new Promise((_, reject) => {
              timeoutHandle = setTimeout(() => {
                reject(createError('qz_ws_timeout', CONNECTION_ERROR_MESSAGES.qz_ws_timeout));
              }, timeoutMs);
            });

            await Promise.race([connectPromiseLocal, timeoutPromise]);
          } else {
            await connectPromiseLocal;
          }
        } catch (error) {
          if (error && error.code === 'qz_ws_timeout') {
            try {
              await qz.websocket.disconnect();
            } catch (disconnectErr) {
              log('warn', 'ยกเลิกการเชื่อมต่อหลัง timeout ไม่สำเร็จ', disconnectErr);
            }
          }
          throw error;
        } finally {
          if (timeoutHandle) {
            clearTimeout(timeoutHandle);
          }
        }
      };

      const performConnection = async (options = {}) => {
        await ensureLoaded();
        await configureSecurityIfNeeded();
        ensureQzAvailable();
        attachWebsocketHandlers();

        if (qz.websocket.isActive()) {
          updateState('active');
          const report = {
            success: true,
            endpoint: null,
            triedEndpoints: lastConnectionReport.triedEndpoints || [],
            lastError: null,
            timestamp: Date.now(),
          };
          updateLastConnectionReport(report);
          return report;
        }

        const secureOrigin = isSecureOrigin();
        const allowInsecure = false;
        const autoLaunch = options.autoLaunch === undefined ? true : !!options.autoLaunch;
        const timeoutMs = options.timeoutMs || CONNECT_TIMEOUT_MS;

        const overrides = readConnectionOverrides();
        const endpoints = buildEndpointList(overrides);

        const triedEndpoints = [];
        let lastError = null;
        let successEndpoint = null;
        let launchTriggered = false;
        let delayBeforeNext = 0;

        for (let attempt = 0; attempt < endpoints.length; attempt += 1) {
          const endpoint = endpoints[attempt];

          if (!endpoint.secure && secureOrigin && !allowInsecure) {
            triedEndpoints.push({
              url: endpoint.url,
              host: endpoint.host,
              port: endpoint.port,
              secure: endpoint.secure,
              skipped: true,
              reason: 'https_only',
            });
            continue;
          }

          if (attempt > 0 || delayBeforeNext > 0) {
            const backoff = CONNECT_BACKOFF_MS[Math.min(attempt, CONNECT_BACKOFF_MS.length - 1)];
            const waitMs = Math.max(backoff, delayBeforeNext);
            if (waitMs > 0) {
              await delay(waitMs);
            }
            delayBeforeNext = 0;
          }

          updateState('connecting');

          try {
            await connectOnce(createConnectConfig(endpoint, overrides), timeoutMs);
            if (qz.websocket.isActive()) {
              updateState('active');
              updateSecurityState({ trusted: true });
              logSecuritySummary();
              await verifyRemoteCertificateChain();
              console.log(`${LOG_PREFIX} Connection: Ready`);
              successEndpoint = endpoint;
              triedEndpoints.push({
                url: endpoint.url,
                host: endpoint.host,
                port: endpoint.port,
                secure: endpoint.secure,
                success: true,
              });
              break;
            }
          } catch (err) {
            const mapped = mapConnectionError(err);
            if (shouldAttemptWhitelistRepair(mapped)) {
              updateSecurityState({ trusted: false });
              await attemptWhitelistRepair(mapped.message || mapped.code || 'security_error');
            }
            lastError = mapped;
            updateState('inactive');
            triedEndpoints.push({
              url: endpoint.url,
              host: endpoint.host,
              port: endpoint.port,
              secure: endpoint.secure,
              success: false,
              error: mapped.code,
              message: mapped.message,
            });
            log('warn', `เชื่อมต่อ QZ Tray ล้มเหลวที่ ${endpoint.url}`, mapped);

            if (!launchTriggered && autoLaunch) {
              launchTriggered = true;
              await tryLaunchQz();
              delayBeforeNext = randomBetween(LAUNCH_DELAY_MIN_MS, LAUNCH_DELAY_MAX_MS);
            }
          }
        }

        if (successEndpoint) {
          const report = {
            success: true,
            endpoint: successEndpoint,
            triedEndpoints,
            lastError: null,
            timestamp: Date.now(),
          };
          updateLastConnectionReport(report);
          return report;
        }

        if (!lastError && secureOrigin && triedEndpoints.every((item) => item.skipped)) {
          lastError = createError('qz_mixed_content', CONNECTION_ERROR_MESSAGES.qz_mixed_content);
        } else if (!lastError) {
          lastError = createError('qz_connect_failed', CONNECTION_ERROR_MESSAGES.qz_connect_failed);
        }

        updateState('inactive');

        const report = {
          success: false,
          endpoint: null,
          triedEndpoints,
          lastError: toSerializableError(lastError),
          timestamp: Date.now(),
        };
        updateLastConnectionReport(report);
        log('error', 'เชื่อมต่อ QZ Tray ไม่สำเร็จหลังลองทุก endpoint', lastError);
        updateSecurityState({ trusted: false });
        logSecuritySummary();

        throw lastError;
      };

      const ensureConnected = (options = {}) => {
        if (qz.websocket.isActive()) {
          updateState('active');
          updateSecurityState({ trusted: true });
          logSecuritySummary();
          logConnectionReady();
          const report = {
            success: true,
            endpoint: null,
            triedEndpoints: lastConnectionReport.triedEndpoints || [],
            lastError: null,
            timestamp: Date.now(),
          };
          updateLastConnectionReport(report);
          return Promise.resolve(report);
        }

        if (connectPromise) {
          return connectPromise;
        }

        connectPromise = performConnection(options)
          .then((report) => {
            logConnectionReady();
            return report;
          })
          .finally(() => {
            connectPromise = null;
          });

        return connectPromise;
      };

      const mapPrinterLookupError = (printerName, error) => {
        const trimmedName = typeof printerName === 'string' ? printerName.trim() : '';
        const notFoundMessage = trimmedName
          ? `ไม่พบเครื่องพิมพ์ใน QZ Tray: ${trimmedName}`
          : 'ไม่พบเครื่องพิมพ์ที่ QZ Tray รายงาน';

        if (!error) {
          return createError('qz_printer_not_found', notFoundMessage);
        }

        if (typeof error.code === 'string') {
          const normalizedCode = error.code.toLowerCase();
          if (normalizedCode.includes('signature') || normalizedCode.includes('certificate')) {
            return createError(
              'qz_security_error',
              'certificate หรือ signature ของ QZ Tray ไม่ผ่านการตรวจสอบ หรือ origin นี้ยังไม่ได้อยู่ใน Allowed Origins (หลังแก้ไขให้รีเฟรชหน้าแล้วลองใหม่)',
              error,
            );
          }
        }

        const message = String(error.message || error).toLowerCase();
        if (message.includes('not found') || message.includes('found no')) {
          return createError('qz_printer_not_found', notFoundMessage);
        }

        if (
          message.includes('security')
          || message.includes('certificate')
          || message.includes('signature')
        ) {
          return createError(
            'qz_security_error',
            'certificate หรือ signature ของ QZ Tray ไม่ผ่านการตรวจสอบ หรือ origin นี้ยังไม่ได้อยู่ใน Allowed Origins (หลังแก้ไขให้รีเฟรชหน้าแล้วลองใหม่)',
            error,
          );
        }

        return createError('qz_lookup_failed', 'ค้นหาเครื่องพิมพ์จาก QZ Tray ไม่สำเร็จ', error);
      };

      const resolvePrinterName = async (printerName) => {
        if (!printerName) {
          return null;
        }

        try {
          const result = await qz.printers.find(printerName);
          if (Array.isArray(result)) {
            return result[0] || null;
          }
          return result || printerName;
        } catch (error) {
          throw mapPrinterLookupError(printerName, error);
        }
      };

      const listPrinters = async () => {
        await ensureConnected();

        try {
          const result = await qz.printers.find();
          const printers = Array.isArray(result) ? result : (result ? [result] : []);
          log('info', `QZ Tray รายงานเครื่องพิมพ์ทั้งหมด ${printers.length} เครื่อง`);
          return printers;
        } catch (error) {
          throw mapPrinterLookupError(null, error);
        }
      };

      const mapPrintError = (error) => {
        if (!error) {
          return createError('qz_print_failed', 'สั่งพิมพ์ผ่าน QZ Tray ไม่สำเร็จ', error);
        }

        if (typeof error.code === 'string') {
          const normalizedCode = error.code.toLowerCase();
          if (normalizedCode.includes('signature') || normalizedCode.includes('certificate')) {
            return createError(
              'qz_security_error',
              'certificate หรือ signature ของ QZ Tray ไม่ผ่านการตรวจสอบ หรือ origin นี้ยังไม่ได้อยู่ใน Allowed Origins (หลังแก้ไขให้รีเฟรชหน้าแล้วลองใหม่)',
              error,
            );
          }
          if (normalizedCode.includes('bad_image')) {
            return createError('qz_bad_image', 'bad image data', error);
          }
        }

        const message = String(error.message || error).toLowerCase();
        if (
          message.includes('security')
          || message.includes('certificate')
          || message.includes('signature')
        ) {
          return createError(
            'qz_security_error',
            'certificate หรือ signature ของ QZ Tray ไม่ผ่านการตรวจสอบ หรือ origin นี้ยังไม่ได้อยู่ใน Allowed Origins (หลังแก้ไขให้รีเฟรชหน้าแล้วลองใหม่)',
            error,
          );
        }
        if (message.includes('bad image')) {
          return createError(
            'qz_bad_image',
            'ไฟล์ภาพไม่ถูกต้อง/ใหญ่เกินไป (ควรกว้าง 576px)',
            error,
          );
        }
        if (message.includes('unknown type')) {
          return createError(
            'qz_invalid_payload',
            'รูปแบบข้อมูลไม่ถูกต้อง (type ต้องเป็น image)',
            error,
          );
        }
        if (
          message.includes('band too large')
          || (message.includes('band') && message.includes('large'))
          || message.includes('out of memory')
        ) {
          return createError(
            'qz_band_too_large',
            'แบ่งภาพเป็นแถบเล็กลง (≤256 แถวต่อครั้ง)',
            error,
          );
        }
        if (message.includes('printer not found')) {
          return createError('qz_printer_not_found', 'ไม่พบเครื่องพิมพ์ที่เลือกใน QZ Tray', error);
        }
        return createError('qz_print_failed', 'สั่งพิมพ์ผ่าน QZ Tray ไม่สำเร็จ', error);
      };

      const ensureDataUrl = (base64Value) => {
        const trimmed = String(base64Value || '').trim();
        if (!trimmed) {
          return null;
        }
        if (trimmed.startsWith('data:image')) {
          return trimmed;
        }
        return `data:image/png;base64,${trimmed}`;
      };


      const loadImageElement = (dataUrl) => new Promise((resolve, reject) => {
        try {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = (event) => {
            const original = event?.error || event;
            reject(createError('qz_bad_image', 'bad image data', original));
          };
          image.src = dataUrl;
        } catch (err) {
          reject(createError('qz_bad_image', 'bad image data', err));
        }
      });

      const renderThermalCanvas = (image, scale) => {
        const scaledWidth = Math.max(1, Math.round(image.width * scale));
        const scaledHeight = Math.max(1, Math.round(image.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = TARGET_IMAGE_WIDTH;
        canvas.height = Math.max(1, Math.min(MAX_IMAGE_HEIGHT, scaledHeight));
        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) {
          throw createError('qz_bad_image', 'bad image data');
        }
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        if (typeof context.imageSmoothingEnabled !== 'undefined') {
          context.imageSmoothingEnabled = false;
        }
        if (typeof context.imageSmoothingQuality !== 'undefined') {
          context.imageSmoothingQuality = 'low';
        }
        const drawWidth = Math.min(scaledWidth, canvas.width);
        const drawHeight = Math.min(scaledHeight, canvas.height);
        const offsetX = Math.max(0, Math.floor((canvas.width - drawWidth) / 2));
        context.drawImage(
          image,
          0,
          0,
          image.width,
          image.height,
          offsetX,
          0,
          drawWidth,
          drawHeight,
        );
        const dataUrl = canvas.toDataURL('image/png');
        const base64Body = dataUrl.includes(',')
          ? dataUrl.slice(dataUrl.indexOf(',') + 1)
          : dataUrl;
        return {
          canvas,
          width: canvas.width,
          height: canvas.height,
          contentWidth: drawWidth,
          contentHeight: drawHeight,
          dataUrl,
          base64Body,
          base64Length: base64Body.length,
          hasDataUrlPrefix: dataUrl.startsWith('data:image/png;base64,'),
        };
      };

      const prepareThermalImage = async (base64Input) => {
        const dataUrl = ensureDataUrl(base64Input);
        if (!dataUrl) {
          throw createError('qz_bad_image', 'bad image data');
        }
        const image = await loadImageElement(dataUrl);
        const width = Math.max(1, image.width);
        const height = Math.max(1, image.height);
        if (!width || !height) {
          throw createError('qz_bad_image', 'bad image data');
        }

        let scale = TARGET_IMAGE_WIDTH / width;
        if (!Number.isFinite(scale) || scale <= 0) {
          scale = 1;
        }
        if (height * scale > MAX_IMAGE_HEIGHT) {
          scale = MAX_IMAGE_HEIGHT / height;
        }

        let currentScale = scale;
        let minScale = scale * IMAGE_SCALE_RELATIVE_FLOOR;
        if (minScale < MIN_IMAGE_SCALE) {
          minScale = MIN_IMAGE_SCALE;
        }
        if (minScale > scale) {
          minScale = scale;
        }
        let lastRender = null;

        for (let attempt = 0; attempt < 8; attempt += 1) {
          lastRender = renderThermalCanvas(image, currentScale);
          if (
            lastRender.base64Length <= MAX_IMAGE_BASE64_LENGTH
            || currentScale <= minScale
          ) {
            return { ...lastRender, scale: currentScale };
          }
          const nextScale = currentScale * 0.92;
          currentScale = nextScale <= minScale ? minScale : nextScale;
        }

        return { ...lastRender, scale: currentScale };
      };

      const sliceCanvasToBands = (canvas) => {
        const width = canvas.width;
        const height = canvas.height;
        if (height <= IMAGE_BAND_HEIGHT) {
          return [
            {
              dataUrl: canvas.toDataURL('image/png'),
              height,
            },
          ];
        }

        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) {
          throw createError('qz_bad_image', 'bad image data');
        }
        const fullImage = context.getImageData(0, 0, width, height);
        const bands = [];

        for (let y = 0; y < height; y += IMAGE_BAND_HEIGHT) {
          const bandHeight = Math.min(IMAGE_BAND_HEIGHT, height - y);
          const bandCanvas = document.createElement('canvas');
          bandCanvas.width = width;
          bandCanvas.height = bandHeight;
          const bandContext = bandCanvas.getContext('2d');
          if (!bandContext) {
            throw createError('qz_bad_image', 'bad image data');
          }
          bandContext.putImageData(fullImage, 0, -y);
          bands.push({
            dataUrl: bandCanvas.toDataURL('image/png'),
            height: bandHeight,
          });
        }

        return bands;
      };

      const buildImagePayloads = (prepared) => {
        const bands = sliceCanvasToBands(prepared.canvas);
        const payloads = bands.map((band) => ({
          type: 'image',
          data: band.dataUrl,
        }));
        return {
          payloads,
          bandCount: payloads.length,
        };
      };

      const toHex = (buffer) => Array.from(buffer)
        .map((value) => value.toString(16).padStart(2, '0'))
        .join('');

      const DEFAULT_THERMAL_JOB_NAME = 'MyDent Thermal Print Job';

      const createThermalConfig = (printerName, overrides = {}) => {
        ensureQzAvailable();
        if (!qz.configs || typeof qz.configs.create !== 'function') {
          throw createError('qz_config_error', 'ไม่พบ qz.configs.create');
        }

        const normalizedPrinter = typeof printerName === 'string' && printerName.trim()
          ? printerName.trim()
          : null;

        const baseOptions = {
          copies: 1,
          colorType: 'grayscale',
          density: 'default',
          duplex: false,
          encoding: 'utf8',
          interpolation: 'nearest-neighbor',
          jobName: DEFAULT_THERMAL_JOB_NAME,
          margins: 0,
          rasterize: true,
          altPrinting: false,
        };

        const merged = {
          ...baseOptions,
          ...overrides,
        };

        if (typeof merged.jobName !== 'string' || !merged.jobName.trim()) {
          merged.jobName = DEFAULT_THERMAL_JOB_NAME;
        }

        if (typeof merged.margins !== 'number' && (typeof merged.margins !== 'object' || merged.margins === null)) {
          merged.margins = 0;
        }

        merged.altPrinting = overrides.altPrinting === true;

        if (typeof overrides.rasterize === 'boolean') {
          merged.rasterize = overrides.rasterize;
        }

        return qz.configs.create(normalizedPrinter, merged);
      };

      const buildEscPosRasterPayloads = (prepared) => {
        const width = prepared.width;
        const height = prepared.height;
        const context = prepared.canvas.getContext('2d', { willReadFrequently: true });
        if (!context) {
          throw createError('qz_bad_image', 'bad image data');
        }
        const imageData = context.getImageData(0, 0, width, height);
        const totalPixels = width * height;
        const grayscale = new Float64Array(totalPixels);

        for (let i = 0; i < totalPixels; i += 1) {
          const offset = i * 4;
          const r = imageData.data[offset];
          const g = imageData.data[offset + 1];
          const b = imageData.data[offset + 2];
          grayscale[i] = (0.299 * r) + (0.587 * g) + (0.114 * b);
        }

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const index = y * width + x;
            const oldPixel = grayscale[index];
            const newPixel = oldPixel < 128 ? 0 : 255;
            const error = oldPixel - newPixel;
            grayscale[index] = newPixel;
            if (x + 1 < width) {
              grayscale[index + 1] += error * (7 / 16);
            }
            if (y + 1 < height) {
              if (x > 0) {
                grayscale[index + width - 1] += error * (3 / 16);
              }
              grayscale[index + width] += error * (5 / 16);
              if (x + 1 < width) {
                grayscale[index + width + 1] += error * (1 / 16);
              }
            }
          }
        }

        const widthBytes = Math.ceil(width / 8);
        const payloads = [];

        for (let y = 0; y < height; y += ESC_POS_MAX_BAND_ROWS) {
          const rows = Math.min(ESC_POS_MAX_BAND_ROWS, height - y);
          const band = new Uint8Array(widthBytes * rows);

          for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < widthBytes; col += 1) {
              let byte = 0;
              for (let bit = 0; bit < 8; bit += 1) {
                const pixelX = col * 8 + bit;
                if (pixelX >= width) {
                  continue;
                }
                const pixelIndex = (y + row) * width + pixelX;
                if (grayscale[pixelIndex] < 128) {
                  byte |= 0x80 >> bit;
                }
              }
              band[row * widthBytes + col] = byte;
            }
          }

          const header = new Uint8Array(8 + band.length);
          header[0] = 0x1d;
          header[1] = 0x76;
          header[2] = 0x30;
          header[3] = 0x00;
          header[4] = widthBytes & 0xff;
          header[5] = (widthBytes >> 8) & 0xff;
          header[6] = rows & 0xff;
          header[7] = (rows >> 8) & 0xff;
          header.set(band, 8);

          payloads.push({
            type: 'raw',
            format: 'hex',
            data: toHex(header),
          });
        }

        return payloads;
      };

      const printImagePayloads = async (printer, payloads) => {
        let lastError = null;
        const attempts = [
          { altPrinting: false, label: 'primary' },
          { altPrinting: true, label: 'altPrinting' },
        ];

        for (let index = 0; index < attempts.length; index += 1) {
          const attempt = attempts[index];
          const config = createThermalConfig(printer, { altPrinting: attempt.altPrinting });
          try {
            await qz.print(config, payloads);
            log(
              'info',
              `สั่งพิมพ์ผ่าน QZ Tray สำเร็จ${printer ? ` (printer: ${printer})` : ''}${attempt.altPrinting ? ' [altPrinting]' : ''}`,
            );
            console.log(`${LOG_PREFIX} Print(Image): Success${attempt.altPrinting ? ' (altPrinting)' : ''}`);
            return { config, altPrinting: attempt.altPrinting };
          } catch (error) {
            console.error(`${LOG_PREFIX} Print(Image): Failed${attempt.altPrinting ? ' (altPrinting)' : ''}`, error);
            lastError = error;
          }
        }

        throw lastError || createError('qz_print_failed', 'สั่งพิมพ์ผ่าน QZ Tray ไม่สำเร็จ');
      };

      const printEscPosRaster = async (printer, prepared) => {
        const payloads = buildEscPosRasterPayloads(prepared);
        const config = createThermalConfig(printer, { rasterize: false, altPrinting: false });
        await qz.print(config, payloads);
        console.log(`${LOG_PREFIX} Print(RawRaster): Success`);
        return { config, payloads };
      };

      const buildFeedPayload = () => ({
        type: 'raw',
        format: 'hex',
        data: FEED_CMD_SMALL_HEX,
      });

      const buildFullCutPayload = () => ({
        type: 'raw',
        format: 'hex',
        data: CUT_CMD_FULL_HEX,
      });

      const buildPartialCutPayload = () => ({
        type: 'raw',
        format: 'hex',
        data: CUT_CMD_PARTIAL_HEX,
      });

      const performCut = async (printer) => {
        const config = createThermalConfig(printer, { rasterize: false, altPrinting: false });
        const feedPayload = buildFeedPayload();
        const fullCutPayload = buildFullCutPayload();
        const partialCutPayload = buildPartialCutPayload();
        try {
          await qz.print(config, [feedPayload, fullCutPayload]);
          console.log(`${LOG_PREFIX} Paper Cut: Success`);
        } catch (error) {
          console.warn(`${LOG_PREFIX} Paper Cut (full) failed, attempting partial`, error);
          try {
            await qz.print(config, [feedPayload, partialCutPayload]);
            console.log(`${LOG_PREFIX} Paper Cut: Success`);
          } catch (partialError) {
            console.error(`${LOG_PREFIX} Paper Cut: Failed`, partialError);
            throw partialError;
          }
        }
      };

      const printRawCommandJob = async (printerName, commandString, meta = {}) => {
        await ensureLoaded();
        await configureSecurityIfNeeded();
        await ensureConnected();

        const resolvedPrinter = await resolvePrinterName(printerName);
        const config = createThermalConfig(resolvedPrinter, {
          rasterize: false,
          altPrinting: false,
          encoding: 'binary',
        });
        await qz.print(config, [
          {
            type: 'raw',
            format: 'command',
            data: commandString,
          },
        ]);
        const info = {
          codePages: Array.isArray(meta.codePages) && meta.codePages.length > 0 ? meta.codePages : [70, 255],
          encoding: meta.encoding || 'TIS-620',
          bytes: typeof meta.bytes === 'number' ? meta.bytes : commandString.length,
        };
        console.log(`${LOG_PREFIX} Print(Text Command): Success`);
        if (typeof console !== 'undefined' && console.debug) {
          console.debug('[MyDent|POS] QZ raw command sent', {
            ...info,
            printer: resolvedPrinter || undefined,
          });
        }
        log(
          'info',
          `สั่งพิมพ์คำสั่ง ESC/POS ผ่าน QZ Tray สำเร็จ${resolvedPrinter ? ` (printer: ${resolvedPrinter})` : ''}`,
        );
        return {
          printer: resolvedPrinter,
        };
      };

      const printTextJob = async (printerName, lines, options = {}) => {
        const settings = {
          feed: options.feed !== false,
          cut: options.cut !== false,
          appendNewline: options.appendNewline !== false,
        };

        const normalizedLines = Array.isArray(lines) ? lines : [lines];
        const printable = normalizedLines
          .map((line) => (typeof line === 'string' ? line : String(line ?? '')))
          .map((line) => line.replace(/\r\n/g, '\n').replace(/\r/g, '\n'))
          .join('\n');

        if (!printable.trim()) {
          throw createError('qz_invalid_payload', 'ไม่มีข้อความสำหรับการพิมพ์');
        }

        await ensureLoaded();
        await configureSecurityIfNeeded();
        await ensureConnected();

        const resolvedPrinter = await resolvePrinterName(printerName);
        const config = createThermalConfig(resolvedPrinter, {
          rasterize: false,
          altPrinting: false,
          encoding: 'binary',
        });
        const { payload, meta } = buildThaiTextPayload(printable, settings.cut !== false);
        await qz.print(config, [payload]);
        console.log(`${LOG_PREFIX} Print(Text): Success`);
        log(
          'info',
          `สั่งพิมพ์ข้อความผ่าน QZ Tray สำเร็จ${resolvedPrinter ? ` (printer: ${resolvedPrinter})` : ''}`,
        );

        if (typeof console !== 'undefined' && console.debug) {
          console.debug('[MyDent|POS] QZ raw command printed', {
            ...meta,
            printer: resolvedPrinter || undefined,
          });
        }

        return {
          printer: resolvedPrinter,
          payloadType: 'text',
          config,
        };
      };

      const printPng = async (base64Png, printerName) => {
        if (!IMAGE_PRINTING_ENABLED) {
          const timestamp = new Date().toLocaleString('th-TH');
          const lines = [
            '*** MyDent Thermal Print (Text only) ***',
            'การพิมพ์ภาพถูกปิดใช้งานชั่วคราวสำหรับการทดสอบ',
            `ร้องขอเมื่อ: ${timestamp}`,
            '',
          ];
          const result = await printTextJob(printerName, lines);
          log('warn', 'ปิดการพิมพ์ภาพชั่วคราว ส่งงานข้อความแทน');
          result.fallback = 'text-only';
          return result;
        }

        if (!base64Png) {
          throw createError('qz_invalid_payload', 'ข้อมูล PNG ไม่ถูกต้องหรือว่างเปล่า');
        }

        await ensureLoaded();
        await configureSecurityIfNeeded();
        await ensureConnected();
        console.log(`${LOG_PREFIX} Connection: Ready`);

        const resolvedPrinter = await resolvePrinterName(printerName);

        let prepared;
        try {
          prepared = await prepareThermalImage(base64Png);
        } catch (error) {
          throw mapPrintError(error);
        }

        console.log(`${LOG_PREFIX} Prepared Image`, {
          w: prepared.width,
          h: prepared.height,
          base64Length: prepared.base64Length,
          hasDataUrlPrefix: prepared.hasDataUrlPrefix,
        });

        const { payloads, bandCount } = buildImagePayloads(prepared);
        logPrintDebug(resolvedPrinter, {
          width: prepared.width,
          height: prepared.height,
          base64Length: prepared.base64Length,
          bandCount,
        });

        try {
          await printImagePayloads(resolvedPrinter, payloads);
        } catch (imageError) {
          const mapped = mapPrintError(imageError);
          console.warn(`${LOG_PREFIX} Print(Image) failed, trying ESC/POS raster fallback`, mapped);
          try {
            await printEscPosRaster(resolvedPrinter, prepared);
            log(
              'info',
              `สั่งพิมพ์ผ่าน ESC/POS RAW สำเร็จ${resolvedPrinter ? ` (printer: ${resolvedPrinter})` : ''}`,
            );
          } catch (rawError) {
            console.error(`${LOG_PREFIX} Print(RawRaster): Failed`, rawError);
            throw mapPrintError(rawError);
          }
          await delay(CUT_DELAY_MS);
          try {
            await performCut(resolvedPrinter);
          } catch (cutError) {
            throw mapPrintError(cutError);
          }
          return { printer: resolvedPrinter };
        }

        await delay(CUT_DELAY_MS);

        try {
          await performCut(resolvedPrinter);
        } catch (error) {
          throw mapPrintError(error);
        }

        return { printer: resolvedPrinter };
      };
      let cachedSelfTestImage = null;

      const buildSelfTestImageDataUrl = () => {
        if (cachedSelfTestImage) {
          return cachedSelfTestImage;
        }
        const canvas = document.createElement('canvas');
        canvas.width = TARGET_IMAGE_WIDTH;
        canvas.height = 240;
        const context = canvas.getContext('2d');
        if (!context) {
          cachedSelfTestImage = 'data:image/png;base64,';
          return cachedSelfTestImage;
        }
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = '#1a73e8';
        context.font = 'bold 48px "Segoe UI", "Arial", sans-serif';
        context.textBaseline = 'top';
        context.fillText('MyDent', 24, 24);
        context.fillStyle = '#000000';
        context.font = '28px "Segoe UI", "Arial", sans-serif';
        context.fillText('Thermal Self-Test', 24, 96);
        context.font = '24px "Segoe UI", "Arial", sans-serif';
        context.fillText('พิมพ์ทดสอบผ่าน QZ Tray', 24, 140);
        const timestamp = new Date().toLocaleString('th-TH');
        context.font = '20px "Segoe UI", "Arial", sans-serif';
        context.fillText(`เวลา ${timestamp}`, 24, 180);
        cachedSelfTestImage = canvas.toDataURL('image/png');
        return cachedSelfTestImage;
      };

      const runRawSelfTest = async (printerName) => {
        try {
          const timestamp = new Date().toLocaleString('th-TH');
          await printTextJob(printerName, [
            'Hello MyDent',
            'พิมพ์ทดสอบผ่าน QZ Tray (ข้อความ)',
            `เวลา ${timestamp}`,
            '',
          ]);
          console.log(`${LOG_PREFIX} SelfTest(Raw): Success`);
          return {
            success: true,
            message: 'พิมพ์ข้อความทดสอบสำเร็จ',
          };
        } catch (error) {
          console.error(`${LOG_PREFIX} SelfTest(Raw): Failed`, error);
          const mapped = mapPrintError(error);
          return {
            success: false,
            message: mapped.message || 'พิมพ์ข้อความทดสอบไม่สำเร็จ',
            errorCode: mapped.code || null,
          };
        }
      };

      const runImageSelfTest = async (printerName) => {
        if (!IMAGE_PRINTING_ENABLED) {
          const timestamp = new Date().toLocaleString('th-TH');
          return {
            success: false,
            message: `ข้ามการทดสอบภาพ (ปิดใช้งานชั่วคราวเมื่อ ${timestamp})`,
            skipped: true,
          };
        }

        const now = () => (typeof performance !== 'undefined' && typeof performance.now === 'function'
          ? performance.now()
          : Date.now());
        const imageDataUrl = buildSelfTestImageDataUrl();
        const base64Body = imageDataUrl.includes(',')
          ? imageDataUrl.slice(imageDataUrl.indexOf(',') + 1)
          : imageDataUrl;

        let prepared;
        try {
          prepared = await prepareThermalImage(base64Body);
        } catch (error) {
          const mapped = mapPrintError(error);
          console.error(`${LOG_PREFIX} SelfTest(Image): Failed during preparation`, error);
          return {
            success: false,
            message: mapped.message || 'เตรียมภาพทดสอบไม่สำเร็จ',
            errorCode: mapped.code || null,
          };
        }

        console.log(`${LOG_PREFIX} Prepared SelfTest Image`, {
          w: prepared.width,
          h: prepared.height,
          base64Length: prepared.base64Length,
          hasDataUrlPrefix: prepared.hasDataUrlPrefix,
        });

        const { payloads, bandCount } = buildImagePayloads(prepared);
        logPrintDebug(printerName, {
          width: prepared.width,
          height: prepared.height,
          base64Length: prepared.base64Length,
          bandCount,
        });

        const details = [];
        let imageErrorMapped = null;
        let rawErrorMapped = null;

        const imageStart = now();
        try {
          await printImagePayloads(printerName, payloads);
          const duration = Math.round(now() - imageStart);
          await delay(CUT_DELAY_MS);
          await performCut(printerName);
          details.push(`type:image สำเร็จ (${duration} ms, bands: ${bandCount})`);
        } catch (error) {
          const duration = Math.round(now() - imageStart);
          imageErrorMapped = mapPrintError(error);
          details.push(`type:image ล้มเหลว (${duration} ms, bands: ${bandCount}) - ${imageErrorMapped.message}`);
        }

        await delay(CUT_DELAY_MS);

        const rawStart = now();
        try {
          await printEscPosRaster(printerName, prepared);
          const duration = Math.round(now() - rawStart);
          await delay(CUT_DELAY_MS);
          await performCut(printerName);
          details.push(`ESC/POS สำเร็จ (${duration} ms)`);
        } catch (error) {
          const duration = Math.round(now() - rawStart);
          rawErrorMapped = mapPrintError(error);
          details.push(`ESC/POS ล้มเหลว (${duration} ms) - ${rawErrorMapped.message}`);
        }

        const success = !imageErrorMapped && !rawErrorMapped;
        const message = details.join('\n');

        if (success) {
          console.log(`${LOG_PREFIX} SelfTest(Image): Success`);
        } else {
          console.error(`${LOG_PREFIX} SelfTest(Image): Failed`, { message });
        }

        return {
          success,
          message,
          errorCode: imageErrorMapped?.code || rawErrorMapped?.code || null,
        };
      };

      const selfTest = async (printerName = null, options = {}) => {
        const summary = {
          version: null,
          isActive: false,
          triedEndpoints: [],
          lastError: null,
          printersCount: null,
        };

        const tests = {
          rawTest: {
            success: false,
            message: options.runPrints === true
              ? 'กำลังเตรียมการทดสอบ...'
              : 'ยังไม่ได้ทดสอบ (ไม่ได้ร้องขอ)',
            skipped: options.runPrints === true ? false : true,
          },
          imageTest: {
            success: false,
            message: options.runPrints === true
              ? 'กำลังเตรียมการทดสอบ...'
              : 'ยังไม่ได้ทดสอบ (ไม่ได้ร้องขอ)',
            skipped: options.runPrints === true ? false : true,
          },
        };

        let resolvedPrinter = null;

        try {
          if (connectPromise) {
            try {
              await connectPromise;
            } catch (_) {
              // ignore, handled later
            }
          }

          await ensureLoaded();
          await configureSecurityIfNeeded();
          ensureQzAvailable();
          attachWebsocketHandlers();

          let report = lastConnectionReport;

          if (!qz.websocket.isActive()) {
            try {
              report = await performConnection({
                autoLaunch: false,
                timeoutMs: SELF_TEST_TIMEOUT_MS,
                allowInsecure: !isSecureOrigin(),
              });
            } catch (error) {
              const mapped = mapConnectionError(error);
              summary.lastError = toSerializableError(mapped);
              summary.triedEndpoints = (lastConnectionReport.triedEndpoints || []).map((item) => ({ ...item }));
              summary.rawTest = tests.rawTest;
              summary.imageTest = tests.imageTest;
              summary.printer = null;
              return summary;
            }
          }

          summary.triedEndpoints = (report?.triedEndpoints || []).map((item) => ({ ...item }));
          summary.isActive = qz.websocket.isActive();

          if (summary.isActive) {
            try {
              summary.version = await qz.api.getVersion();
            } catch (error) {
              log('warn', 'อ่านเวอร์ชัน QZ Tray ไม่สำเร็จระหว่าง self-test', error);
            }

            try {
              const printers = await qz.printers.find();
              if (Array.isArray(printers)) {
                summary.printersCount = printers.length;
              } else if (printers) {
                summary.printersCount = 1;
              } else {
                summary.printersCount = 0;
              }
            } catch (error) {
              log('warn', 'อ่านรายชื่อเครื่องพิมพ์ไม่สำเร็จระหว่าง self-test', error);
            }
          }

          if (!summary.lastError && report?.lastError) {
            summary.lastError = { ...report.lastError };
          }

          if (options.runPrints === true) {
            if (!summary.isActive) {
              tests.rawTest = {
                success: false,
                message: 'ข้ามการทดสอบเพราะยังไม่เชื่อมต่อ QZ Tray',
                skipped: true,
              };
              tests.imageTest = {
                success: false,
                message: 'ข้ามการทดสอบเพราะยังไม่เชื่อมต่อ QZ Tray',
                skipped: true,
              };
            } else {
              try {
                resolvedPrinter = await resolvePrinterName(printerName);
              } catch (error) {
                const mapped = mapPrinterLookupError(printerName, error);
                tests.rawTest = {
                  success: false,
                  message: mapped.message || 'ไม่พบเครื่องพิมพ์สำหรับทดสอบ',
                  errorCode: mapped.code || null,
                };
                tests.imageTest = { ...tests.rawTest };
                summary.rawTest = tests.rawTest;
                summary.imageTest = tests.imageTest;
                summary.printer = null;
                return summary;
              }

              tests.rawTest = await runRawSelfTest(resolvedPrinter);
              if (IMAGE_PRINTING_ENABLED) {
                await delay(CUT_DELAY_MS);
              }
              tests.imageTest = await runImageSelfTest(resolvedPrinter);
            }
          }
        } catch (error) {
          const mapped = mapConnectionError(error);
          summary.lastError = toSerializableError(mapped);
          summary.triedEndpoints = (lastConnectionReport.triedEndpoints || []).map((item) => ({ ...item }));
        }

        summary.rawTest = tests.rawTest;
        summary.imageTest = tests.imageTest;
        summary.printer = resolvedPrinter;
        return summary;
      };

      warnIfInsecureOrigin();
      dispatchStatusEvent();

      window.mydentQzLaunch = async () => {
        await tryLaunchQz();
        const waitMs = randomBetween(LAUNCH_DELAY_MIN_MS, LAUNCH_DELAY_MAX_MS);
        await delay(waitMs);
        return ensureConnected({ autoLaunch: false });
      };

      window.mydentQzEnsureLoaded = () => ensureLoaded();
      window.mydentQzConnect = (options) => ensureConnected(options || {});
      window.mydentQzListPrinters = () => listPrinters();
      window.mydentQzPrintPng = (base64Png, printerName) => printPng(base64Png, printerName || null);
      window.mydentQzPrintCommand = (commandString, printerName, meta) => (
        printRawCommandJob(printerName || null, commandString, meta || {})
      );
      window.mydentQzPrintText = (textOrLines, printerName, options) => (
        printTextJob(printerName || null, textOrLines, options || {})
      );
      window.mydentQzCut = (printerName) => (async () => {
        await ensureLoaded();
        await ensureConnected();
        return performCut(printerName || null);
      })();
      window.mydentQzStatus = () => getStatus();
      window.mydentQzStatusDetail = () => buildStatusDetail();
      window.mydentQzSelfTest = (printerName, options) => (
        selfTest(printerName || null, options || {})
      );
      window.mydentQzEnsureWhitelist = () => attemptWhitelistRepair('manual');
      window.mydentQzSecurityStatus = () => buildStatusDetail();
      window.mydentQzOpenSiteManager = () => {
        try {
          window.open('https://localhost:8181/', '_blank', 'noopener,noreferrer');
          return true;
        } catch (error) {
          log('warn', 'เปิด QZ Tray Site Manager ไม่สำเร็จ', error);
          return false;
        }
      };
      window.mydentQzDiagnostics = {
        snapshot: () => snapshotDependencyStatus(),
        checkDependencies: () => checkDependencyStatus(),
        listScripts: () => listDependencyScripts(),
      };
      window.mydentQzSecurityHint = (origin) => {
        const currentOrigin = origin || window.location.origin;
        return [
          'เปิด QZ Tray → Settings → Security → Allowed Origins',
          `เพิ่ม origin ปัจจุบัน: ${currentOrigin}`,
          'เพิ่ม http://localhost (สำหรับงานพัฒนา) หากยังไม่มี',
          'เพิ่มโดเมน production ของ MyDent (เช่น https://app.mydent.co.th)',
          'ใช้ QZ Tray เวอร์ชัน 2.2.x ขึ้นไป และรีสตาร์ทโปรแกรมหลังปรับตั้งค่า',
        ].join('\\n');
      };
      log('info', 'Registered MyDent QZ bridge functions on window');
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
